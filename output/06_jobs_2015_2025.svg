  }
  text { fill:var(--ink2); font-size:13px; }
  .title { fill:var(--ink); font-size:18px; font-weight:600; }
  .head { fill:var(--ink); font-size:14px; font-weight:600; }
  .small { fill:var(--muted); font-size:12px; }
</style>
